# 唯一职责：定义经营分析月报的机器可执行 Playbook 契约。
# 版本：v1.0
# 最后更新：2026-09-24
# 状态：生效（实现未开工）

schema_version: 1
id: monthly-business-review
contract_version: "1.0"
description_source: docs/20-domain/playbooks/monthly-business-review.md

platform_selection:
  mode: explicit
  min_targets: 1
  selectable_from: profile.datasource.platforms
  profile_enabled_is_required: false
  scheduled_run_requires_targets: true

core_capabilities:
  - orders
  - order_lines
  - commercial_amounts
  - currency
  - fx_conversion
  - order_created_time
  - cancellations
  - refund_amount
  - refund_event_time
  - stable_account_key
  - stable_order_key
  - source_watermark

optional_capabilities:
  - product_identity
  - customer_identity
  - traffic_canonical
  - targets
  - return_quantity
  - attribution
  - affiliate
  - live

rule_packs:
  fixed:
    - core
    - domain:ecommerce
    - playbook:monthly-business-review
  per_target_platform: "platform:{platform_id}"
  index: docs/30-constraints/rule-packs.yaml

time_scope:
  calendar: natural_month
  timezone: UTC
  canonical_field: order_created_date
  physical_field_owner: platform_adapter

source_readiness:
  cutoff: report_period_end
  grace_window_source: profile.datasource.platforms.{platform_id}.source_readiness
  require_core_source_watermarks: true
  require_quality_checks: true
  late_data_action: new_revision
  carry_forward_previous_period: false

metric_refs:
  canonical:
    - M101
    - M102
    - M103
    - M104
    - M105
    - M106
    - M207a
    - M302
    - M303
    - M401
  optional:
    - M207b
    - M210
    - M301
    - M402
    - M501
    - M502
    - M503
    - M504
    - M505
    - M506
    - M507

metric_availability:
  M106:
    requires: [product_identity]
  M207b:
    requires: [return_quantity]
  M210:
    requires: [traffic_canonical]
  M301:
    requires: [targets]
  M402:
    dimensions:
      account: {requires: [orders]}
      product: {requires: [product_identity]}
      customer_segment: {requires: [customer_identity]}
  M501:
    requires: [customer_identity]
  M502:
    requires: [customer_identity]
  M503:
    requires: [customer_identity]
  M504:
    requires: [customer_identity]
  M505:
    requires: [customer_identity]
  M506:
    requires: [customer_identity]
  M507:
    requires: [customer_identity]
platform_native_policy:
  registry_driven: true
  requires_regional_official_definition: true
  cross_platform_sum: false

skill_refs:
  - SK-01
  - SK-02
  - SK-03
  - SK-04
  - SK-05
  - SK-08

steps:
  - step_id: select_targets
    type: validate_input
    depends_on: []
    platform_scope: run
    on_unsupported: await_alignment
  - step_id: snapshot_and_adapt
    type: platform_fan_out
    depends_on: [select_targets]
    platform_scope: target_platforms
    required_capabilities: "$core_capabilities"
    on_unsupported: await_alignment
  - step_id: materialize_plan
    type: deterministic_plan
    depends_on: [snapshot_and_adapt]
    platform_scope: run
    approval: C1
  - step_id: archive_source_sql
    type: platform_fan_out
    depends_on: [materialize_plan]
    platform_scope: target_platforms
    approval: C2
  - step_id: compute_metrics
    type: metric_dag
    depends_on: [archive_source_sql]
    platform_scope: target_platforms
  - step_id: validate
    type: validation
    depends_on: [compute_metrics]
    platform_scope: run
  - step_id: render_candidate
    type: report
    depends_on: [validate]
    platform_scope: run
  - step_id: seal_candidate
    type: artifact_seal
    depends_on: [render_candidate]
    platform_scope: run
  - step_id: evaluate
    type: evaluation
    depends_on: [seal_candidate]
    platform_scope: run
  - step_id: approve_and_publish
    type: approval
    depends_on: [evaluate]
    platform_scope: run
    approval: C3

unsupported_policy:
  core: await_alignment_no_waiver
  optional: ask_user_one_at_a_time
  optional_waiver_default_scope: run
  unattended_action: alignment_ticket_and_dry_run
  silent_skip: false

report_policy:
  tiers: [dry_run, formal_partial, formal_final]
  draft_profile_max_tier: dry_run
  uncertified_adapter_max_tier: dry_run
  open_alignment_max_tier: dry_run
  active_incomplete_watermark_max_tier: formal_partial
  final_requires_all_target_core_sources: true

approval_policy:
  C1: run_plan_fingerprint
  C2: component_step_fingerprint
  C3: sealed_candidate_hash_every_run
  platform_set_change_invalidates_C1: true
  unchanged_component_C2_reusable: true

eval_overlays:
  - monthly_business_review
  - cross_platform_coverage
  - report_tier_consistency

outline:
  source: plan
  required_sections:
    - executive_summary
    - canonical_overview
    - platform_sections
    - anomaly_attribution
    - data_coverage
